  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    .diagram-container {
      background: rgba(2, 5, 15, .7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 8px;
      text-align: center;
    }

    .diagram-container img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .diagram-caption {
      font-family: 'Noto Sans Thai', sans-serif;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 10px;
      text-align: center;
    }

    .packet-dump {
      background: rgba(2, 5, 15, .75);
      border: 1px solid rgba(59, 130, 246, .15);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .packet-dump-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(5, 12, 30, .7);
      border-bottom: 1px solid rgba(59, 130, 246, .12);
    }

    .packet-dump-header .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    .packet-dump-header .dot.red {
      background: #ff5f57;
    }

    .packet-dump-header .dot.yel {
      background: #ffbd2e;
    }

    .packet-dump-header .dot.grn {
      background: var(--green);
    }

    .packet-dump-header .label {
      font-family: 'Noto Sans Thai', monospace;
      font-size: 10px;
      color: var(--text-dim);
      margin-left: auto;
    }

    .packet-dump-body {
      padding: 16px;
      overflow-x: auto;
    }

    .packet-dump-body pre {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.7;
      margin: 0;
      white-space: pre;
    }

    .pkt-offset {
      color: #555;
    }

    .pkt-eth {
      color: #5f87ff;
    }

    .pkt-ip {
      color: #ffbd2e;
    }

    .pkt-tcp {
      color: #00e676;
    }

    .pkt-data {
      color: #e8e8e8;
    }

    .pkt-label {
      color: #777;
      font-style: italic;
    }

    .ascii-diagram {
      background: rgba(2, 5, 15, .7);
      border: 1px solid rgba(59, 130, 246, .12);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 8px;
    }

    .ascii-diagram pre {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.5;
      color: var(--blue);
      text-align: center;
      margin: 0;
    }
  </style>
</head>

            </a>
            <h2>PHISHING MAIL</h2>
          </div>
          <ul class="module-list" id="sidebarList"></ul>
        </aside>

        <main class="module-content">

            <p class="content-breadcrumb">
              <a href="../index.html">Cyberpark</a> ▸
              <a href="nontechnical.html">Non-Technical Path</a> ▸ Phishing Mail
            </p>
            <h1 id="contentTitle">Loading...</h1>
            <button class="terminal-page-btn" id="terminalPageBtn">$ TERMINAL</button>
          </div>
          <div id="contentArea"></div>
        </main>

      </div>
    </div>
  </div>

  <script src="../js/modules/phishing.js"></script>
  <script src="../components/chatbot/chatbot.js"></script>
  <script>window.AUTH_MODE = 'guard';</script>
  <script src="../js/auth.js"></script>
  <script src="../components/terminal/terminal.js"></script>

    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('moduleSidebar').classList.toggle('open');
    });
  </script>
</body>

</html>
