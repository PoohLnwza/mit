<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureSensei -- Cybersecurity Learning Platform</title>
    <meta
      name="description"
      content="SecureSensei: แพลตฟอร์มเรียนรู้ Cybersecurity แบบ pixel-art สำหรับสาย Technical และ Non-Technical"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="binary-rain" id="binaryRain"></div>

    <div class="container">
      <header class="header">
        <div class="logo-icon"></div>
        <h1 class="title glitch" data-text="SECURE SENSEI">SECURE SENSEI</h1>
        <p class="subtitle">
          CYBERSECURITY LEARNING PLATFORM<span class="cursor-blink"></span>
        </p>
        <button
          id="profile-nav-btn"
          class="start-btn"
          style="position: absolute; right: 20px; top: 20px"
          onclick="window.location.href = 'pages/profile.html'"
        >
          LOGIN
        </button>
      </header>

      <p class="terminal-prompt">
        root@securesensei:~$ select_path<span class="cursor-blink"></span>
      </p>

      <div id="landing" class="section active">
        <div class="path-buttons">
          <a href="pages/nontechnical.html" style="text-decoration: none">
            <button class="path-btn nontech" id="btn-nontech">
              <span class="icon"></span>
              <span class="label">
                <span class="name">NON-TECHNICAL PATH</span>
                <span class="desc"
                  >เรียนรู้ภัยคุกคามไซเบอร์ที่ทุกคนต้องรู้</span
                >
              </span>
            </button>
          </a>

          <a href="pages/technical.html" style="text-decoration: none">
            <button class="path-btn tech" id="btn-tech">
              <span class="icon"></span>
              <span class="label">
                <span class="name">TECHNICAL PATH</span>
                <span class="desc"
                  >ฝึกทักษะด้าน Cybersecurity แบบ Hands-on</span
                >
              </span>
            </button>
          </a>
        </div>
      </div>

      <footer class="footer">
        (c) 2026 SecureSensei -- สนับสนุนโดย โครงการคนละครึ่ง พลัส+
      </footer>
    </div>

    <script src="js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('ss_token');
        const navBtn = document.getElementById('profile-nav-btn');
        if (token) {
          navBtn.textContent = 'PROFILE';
          navBtn.classList.add('logged-in');
          navBtn.onclick = () => (window.location.href = 'pages/profile.html');
        } else {
          navBtn.textContent = 'LOGIN';
          navBtn.classList.remove('logged-in');
          navBtn.onclick = () => (window.location.href = 'pages/profile.html');
        }
      });
    </script>
  </body>
</html>
