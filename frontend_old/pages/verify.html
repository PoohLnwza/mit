<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ยืนยันอีเมล -- SecureSensei</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Chakra Petch', sans-serif;
        background: #0a0a0a;
        color: #e8e8e8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: #111;
        border: 1px solid #333;
        border-top: 2px solid #00cc66;
        border-radius: 8px;
        padding: 48px 40px;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .logo {
        font-size: 20px;
        font-weight: 700;
        color: #00cc66;
        letter-spacing: 5px;
        margin-bottom: 6px;
        text-shadow: 0 0 10px rgba(0, 204, 102, 0.4);
      }
      .sub {
        font-size: 11px;
        color: #555;
        letter-spacing: 2px;
        margin-bottom: 40px;
      }
      .icon {
        font-size: 48px;
        margin-bottom: 20px;
      }
      .status-text {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 1px;
        margin-bottom: 12px;
      }
      .status-detail {
        font-size: 13px;
        color: #888;
        line-height: 1.7;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-block;
        padding: 14px 32px;
        background: #00cc66;
        color: #000;
        font-family: 'Chakra Petch', sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        text-decoration: none;
        border-radius: 4px;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #00e673;
      }
      .error .status-text {
        color: #ff4466;
      }
      .success .status-text {
        color: #00cc66;
      }
      .loading .icon {
        animation: spin 1s linear infinite;
        display: inline-block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="logo">SECURE SENSEI</div>
      <div class="sub">CYBERSECURITY LEARNING PLATFORM</div>
      <div class="icon" id="icon">⏳</div>
      <div class="status-text" id="status-text">กำลังยืนยันอีเมล...</div>
      <div class="status-detail" id="status-detail">โปรดรอสักครู่</div>
    </div>

    <script>
      const API = 'http://localhost:8000';

      async function verifyToken() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
          showError('ลิงก์ไม่ถูกต้อง', 'ไม่พบ token ในลิงก์ยืนยัน');
          return;
        }

        try {
          const res = await fetch(
            `${API}/api/auth/verify?token=${encodeURIComponent(token)}`,
          );
          const data = await res.json();

          if (res.ok) {
            showSuccess();
          } else {
            showError(
              'ยืนยันไม่สำเร็จ',
              data.detail || 'ลิงก์ไม่ถูกต้องหรือใช้ไปแล้ว',
            );
          }
        } catch {
          showError(
            'เกิดข้อผิดพลาด',
            'ไม่สามารถเชื่อมต่อ server ได้ กรุณาลองใหม่ภายหลัง',
          );
        }
      }

      function showSuccess() {
        document.getElementById('icon').textContent = '[OK]';
        document.getElementById('status-text').textContent =
          'ยืนยันอีเมลสำเร็จ!';
        document.getElementById('status-detail').innerHTML =
          'บัญชีของคุณพร้อมใช้งานแล้ว<br>คลิกปุ่มด้านล่างเพื่อเข้าสู่ระบบ';
        document.getElementById('card').classList.add('success');
        appendButton('../index.html', 'LOGIN →');
      }

      function showError(title, detail) {
        document.getElementById('icon').textContent = '❌';
        document.getElementById('status-text').textContent = title;
        document.getElementById('status-detail').textContent = detail;
        document.getElementById('card').classList.add('error');
        appendButton('../index.html', 'กลับหน้าหลัก');
      }

      function appendButton(href, label) {
        const a = document.createElement('a');
        a.href = href;
        a.className = 'btn';
        a.textContent = label;
        document.getElementById('card').appendChild(a);
      }

      verifyToken();
    </script>
  </body>
</html>
