<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureSensei — Cybersecurity Learning Platform</title>
  <meta name="description"
    content="SecureSensei: แพลตฟอร์มเรียนรู้ Cybersecurity สำหรับสาย Technical และ Non-Technical" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Press+Start+2P&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div class="app-wrapper">
    <div class="app-container">

      <!-- ─── SIDEBAR ─── -->
      <nav class="sidebar">
        <div class="sidebar-logo">SECURE<br>SENSEI</div>
        <p class="sidebar-desc">CYBER TRAINING SYS</p>

        <div class="nav-menu">
          <a href="#" class="nav-link active">
            <span>HOME</span>
          </a>
          <a href="pages/nontechnical.html" class="nav-link">
            <span>NON-TECHNICAL</span>
          </a>
          <a href="pages/technical.html" class="nav-link orange">
            <span>TECHNICAL</span>
          </a>
          <a href="#" class="nav-link" id="profile-nav-btn" onclick="window.location.href='pages/profile.html'">
            <span>LOGIN</span>
          </a>
        </div>
      </nav>

      <!-- ─── MAIN CONTENT ─── -->
      <main class="main-content">
        <div class="container">

          <header class="header">
            <h1 class="title glitch" data-text="SECURE SENSEI">SECURE SENSEI</h1>
            <p class="subtitle">CHOOSE YOUR PATH<span class="cursor-blink"></span></p>
          </header>

          <p class="terminal-prompt">
            root@securesensei:~$ select_path<span class="cursor-blink"></span>
          </p>

          <div id="landing" class="section active">
            <div class="path-buttons">
              <a href="pages/nontechnical.html" style="text-decoration:none">
                <button class="path-btn nontech" id="btn-nontech">
                  <span class="icon">🛡️</span>
                  <span class="label">
                    <span class="name">NON-TECHNICAL PATH</span>
                    <span class="desc">เรียนรู้ภัยคุกคามไซเบอร์ที่ทุกคนต้องรู้</span>
                  </span>
                </button>
              </a>

              <a href="pages/technical.html" style="text-decoration:none">
                <button class="path-btn tech" id="btn-tech">
                  <span class="icon">⚡</span>
                  <span class="label">
                    <span class="name">TECHNICAL PATH</span>
                    <span class="desc">ฝึกทักษะด้าน Cybersecurity แบบ Hands-on</span>
                  </span>
                </button>
              </a>
            </div>
          </div>

          <footer class="footer">
            (c) 2026 SecureSensei — สนับสนุนโดย โครงการคนละครึ่ง พลัส+
          </footer>

        </div>
      </main>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('ss_token');
      const navBtn = document.getElementById('profile-nav-btn');
      if (token) {
        navBtn.innerHTML = '<span>PROFILE</span>';
        navBtn.onclick = () => (window.location.href = 'pages/profile.html');
      } else {
        navBtn.innerHTML = '<span>LOGIN</span>';
        navBtn.onclick = () => (window.location.href = 'pages/profile.html');
      }
    });
  </script>
</body>

</html>
